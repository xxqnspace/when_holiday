<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="icons/icon-96.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="theme-color" content="#f5f6fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>管理面板 - 登录</title>
    <!-- Open Graph 协议：微信等社交平台分享图文卡片
         部署后请把下面 og:image / og:url 换成你的实际域名（OG 要求绝对地址） -->
    <meta property="og:title" content="管理面板 - 登录">
    <meta property="og:description" content="学期倒计时后台登录入口，登录后可配置学期起止日期、节假日与调休安排。">
    <meta property="og:image" content="/icons/icon-512.png">
    <meta property="og:url" content="/login.html">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --border: #e7e9f2;
            --border-strong: #d9dde9;
            --text: #17203a;
            --text-2: #5a6580;
            --muted: #8d97ad;
            --primary: #4f5bd5;
            --primary-hover: #4149c4;
            --danger: #e5484d;
            --ring: 0 0 0 3px rgba(79, 91, 213, .16);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            color: var(--text);
            background-color: var(--bg);
            /* 柔和的品牌色光晕，替代原来那片紫色渐变 */
            background-image:
                radial-gradient(circle at 18% 12%, rgba(99, 102, 241, .16), transparent 42%),
                radial-gradient(circle at 82% 88%, rgba(79, 91, 213, .13), transparent 46%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* 沉浸式状态栏：白色状态栏文字垫一层极淡暗角（只覆盖 safe-area，不挡点击） */
        @media (display-mode: standalone) {
            body::after {
                content: '';
                position: fixed;
                top: 0; left: 0; right: 0;
                height: env(safe-area-inset-top, 0px);
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0));
                pointer-events: none;
                z-index: 90;
            }
        }

        .login-card {
            width: 100%;
            max-width: 392px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 34px 32px 28px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 24px 48px -16px rgba(16, 24, 40, .18);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 26px;
        }
        .logo-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #4f5bd5);
            color: #fff;
            font-size: 19px;
            margin-bottom: 14px;
            box-shadow: 0 8px 18px -6px rgba(79, 91, 213, .5);
        }
        .login-card h1 {
            font-size: 19px;
            font-weight: 680;
            letter-spacing: -.02em;
            color: var(--text);
        }
        .login-card .subtitle {
            color: var(--muted);
            font-size: 12.5px;
            margin-top: 4px;
        }

        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fdf1f1;
            border: 1px solid #f6d3d4;
            color: #b42326;
            padding: 9px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.45;
        }
        .error::before {
            content: "!";
            flex: 0 0 17px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: grid;
            place-items: center;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            color: var(--text-2);
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 550;
        }
        .field {
            position: relative;
            display: flex;
            align-items: center;
        }
        .field .fa-solid {
            position: absolute;
            left: 13px;
            color: #b3bbcd;
            font-size: 13px;
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 13px 0 38px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            outline: none;
            transition: border-color .16s ease, box-shadow .16s ease;
        }
        .form-group input::placeholder { color: #b3bbcd; }
        .form-group input:hover { border-color: #c9cfdf; }
        .form-group input:focus { border-color: var(--primary); box-shadow: var(--ring); }

        .btn-login {
            width: 100%;
            height: 44px;
            margin-top: 6px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: .02em;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(79, 91, 213, .3);
            transition: background .15s ease, transform .06s ease;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .btn-login:active { transform: translateY(1px); }
        .btn-login:focus-visible { outline: none; box-shadow: var(--ring); }
        .btn-login:disabled { opacity: .62; cursor: default; transform: none; }

        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .back-link a {
            color: var(--muted);
            text-decoration: none;
            font-size: 12.5px;
            transition: color .15s ease;
        }
        .back-link a:hover { color: var(--primary); }

        /* 移动端：输入框字号≥16px，避免 iOS 聚焦自动放大页面 */
        @media (max-width: 768px) {
            .form-group input { font-size: 16px; }
            .login-card { padding: 28px 22px 24px; border-radius: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div class="logo-mark"><i class="fa-solid fa-lock"></i></div>
        <h1>管理面板</h1>
        <p class="subtitle">学期倒计时系统</p>
    </div>

    <div class="error" id="login-error" style="display:none;"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="login-username">用户名</label>
            <div class="field">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="login-username" placeholder="请输入用户名"
                       autocomplete="username" required autofocus>
            </div>
        </div>
        <div class="form-group">
            <label for="login-password">密码</label>
            <div class="field">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="login-password" placeholder="请输入密码"
                       autocomplete="current-password" required>
            </div>
        </div>
        <button type="submit" class="btn-login" id="login-btn">登录</button>
    </form>

    <div class="back-link"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回首页</a></div>
</div>
<script>
    function getCookie(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
    }

    // 进入页面先问一次登录态：已登录直接跳后台，顺带让服务端下发 CSRF cookie
    (async function checkAuth() {
        try {
            const resp = await fetch('/api/session');
            const json = await resp.json();
            if (json.success && json.data && json.data.logged_in) {
                location.replace('admin.html');
            }
        } catch (e) {
            // 接口不可用时停留在登录页
        }
    })();

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('login-btn');
        const errBox = document.getElementById('login-error');
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            // 极端情况下（首个请求失败）cookie 可能还不存在，补发一次
            let csrf = getCookie('holiday_csrf');
            if (!csrf) {
                await fetch('/api/session');
                csrf = getCookie('holiday_csrf');
            }

            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrf,
                },
                body: JSON.stringify({
                    username: document.getElementById('login-username').value.trim(),
                    password: document.getElementById('login-password').value,
                }),
            });
            const json = await resp.json();

            if (json.success) {
                location.replace('admin.html');
                return;
            }

            errBox.textContent = json.message || '登录失败';
            errBox.style.display = '';
        } catch (err) {
            errBox.textContent = '网络错误，请稍后重试';
            errBox.style.display = '';
        }

        btn.disabled = false;
        btn.textContent = '登录';
    });
</script>
</body>
</html>
